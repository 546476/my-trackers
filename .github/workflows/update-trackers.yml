name: Update trackers

on:
  schedule:
    - cron: "36 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trackers
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download and clean trackers
        run: python scripts/get_trackers.py

      - name: Check trackers
        run: python scripts/check-trackers.py

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers.txt
          if [ -f failed-sources.txt ]; then
            git add failed-sources.txt
          fi
          git diff --cached --quiet || git commit -m "Update trackers"
          git push
