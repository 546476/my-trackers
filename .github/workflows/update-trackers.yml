name: Update trackers

on:
  schedule:
    - cron: "36 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trackers
  cancel-in-progress: true

jobs:
  collect:
    name: Collect tracker lists
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and clean trackers
        run: python scripts/get_trackers.py

      - name: Upload raw tracker list
        uses: actions/upload-artifact@v7
        with:
          name: trackers-raw
          path: trackers.txt
          if-no-files-found: error
          retention-days: 1

  check:
    name: Check trackers from home IP
    needs: collect
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download raw tracker list
        uses: actions/download-artifact@v8
        with:
          name: trackers-raw
          path: .

      - name: Check trackers
        run: C:Users\thenaAppDataLocalProgramsPythonPython313python.exe scripts/check-trackers.py

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers.txt
          if (Test-Path failed-sources.txt) { git add failed-sources.txt }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update trackers"
          }

          git pull --rebase origin main
          git push origin main
