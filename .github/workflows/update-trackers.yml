name: Update trackers

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and clean trackers
        run: |
          python3 - <<'PY'
          import re, urllib.request

          urls = [
              "https://ngosang.github.io/trackerslist/trackers_all.txt",
              "https://cdn.jsdelivr.net/gh/ngosang/trackerslist@master/trackers_all.txt",
              "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt",
              "https://cf.trackerslist.com/all.txt",
              "https://raw.githubusercontent.com/00xc0d3/BitTorrent-Tracker-List/refs/heads/main/trackers_all.txt",
              "https://mokk731.github.io/txt/trackerslist.txt",
              "https://trackers.run/s/rw_ws_up_hp_hs_v4_v6.txt",
          ]

          trackers = set()

          for url in urls:
              try:
                  text = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "ignore")
                  for line in text.splitlines():
                      t = line.strip()
                      if re.fullmatch(r"(?:udp|https?)://\S+/announce(?:\.php)?", t):
                          trackers.add(t)
              except Exception as e:
                  print(f"FAILED: {url}: {e}")

          with open("trackers.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(sorted(trackers)) + "\n")

          print(f"Saved {len(trackers)} trackers")
          PY

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers.txt
          git diff --cached --quiet || git commit -m "Update trackers"
          git push
