name: Update trackers

on:
  schedule:
    - cron: "36 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trackers
  cancel-in-progress: true

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: C:\Users\thena\AppData\Local\Programs\Python\Python313\python.exe -m pip install -r requirements.txt

      - name: Download and clean trackers
        run: C:\Users\thena\AppData\Local\Programs\Python\Python313\python.exe scripts/get_trackers.py

      - name: Check trackers
        run: C:\Users\thena\AppData\Local\Programs\Python\Python313\python.exe scripts/check-trackers.py

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers.txt
          if (Test-Path failed-sources.txt) { git add failed-sources.txt }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update trackers"
          }

          git pull --rebase origin main
          git push origin main
