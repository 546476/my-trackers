name: Update trackers

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trackers
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download and clean trackers
        run: python3 scripts/get_trackers.py

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers.txt
          if [ -f failed-sources.txt ]; then
            git add failed-sources.txt
          fi
          git diff --cached --quiet || git commit -m "Update trackers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Check Trackers
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install aiohttp
          python scripts/check-trackers.py
